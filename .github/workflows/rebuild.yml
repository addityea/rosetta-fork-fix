name: rebuild-fix-images
on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays: pick up upstream ubuntu/pixi updates
  workflow_dispatch:
    inputs:
      ubuntu_version:
        description: "Ubuntu tag to base on"
        default: "24.04"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: saditya88
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: fix-only scratch image (composable)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.fix
          platforms: linux/amd64
          push: true
          tags: |
            saditya88/rosetta-fork-fix:latest
            saditya88/rosetta-fork-fix:fix1
      - name: pre-fixed ubuntu image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ubuntu
          platforms: linux/amd64
          push: true
          build-args: UBUNTU_VERSION=${{ inputs.ubuntu_version || '24.04' }}
          tags: |
            saditya88/ubuntu-fix:24.04-fix1
            saditya88/ubuntu-fix:latest
      # smoke test: kernel launch must work (image carries no python;
      # test on a derived image instead)
      - name: smoke test
        run: |
          docker build -t smoke -f- . <<'EOF'
          FROM saditya88/ubuntu-fix:latest
          RUN apt-get update -qq && apt-get install -y -qq --no-install-recommends python3 python3-zmq >/dev/null
          EOF
          docker run --rm smoke python3 -c "
          import zmq, os
          ctx = zmq.Context.instance(); s = ctx.socket(zmq.REP)
          pid = os.fork()
          if pid == 0: os._exit(0)
          os.waitpid(pid, 0)
          print('SMOKE PASSED')"
